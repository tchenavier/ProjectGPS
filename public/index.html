<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link rel="stylesheet" href="main.css">

    <link rel="stylesheet" href="leaflet/leaflet.css" integrity="sha256-RwBOaSN3kFqUIUAZaMmmo5grrEMRXwBCe0sCRJgqydk=" crossorigin=""/>
	<script type="importmap">
		{
			"imports": {
				"leaflet": "/leaflet/leaflet.js"
			}
		}
	</script>
	<style>
		html, body {
			height: 100%;
			margin: 0;
		}
		.leaflet-container {
			height: 100%;
		}
	</style>

</head>
<body>
    <h1 id="text">Bienvenue sur notre page d'inscription</h1>
    <input type="text" id="loginInput" placeholder="Login">
    <input type="password" id="passwordInput" placeholder="Password">
    <input type="button" value="Se connecter" id="login">
    <input type="button" value="S'inscrire" id="monBouton4">
    <button id="decoBtn">Déconnexion</button>
    <button id="supprBtn">Supression du compte</button>
    <button id="afficherUserBtn">Afficher les utilisateurs</button>
    <div id="userList"></div>
    <button id="changemdp" >Changer le mot de passe</button>
    <div id="changePasswordForm" style="display: none;">
        <input type="password" id="newPasswordInput" placeholder="Nouveau mot de passe">
        <input type="button" value="Changer le mot de passe" id="changePasswordBtn">
    </div>
    <button id="surprise">surprise</button>
    <img id="phoenixImage" src="images/perenoel.jpg" alt="Phénix">

    <div id='map'></div>


    <script src="main.js"></script>
</body>
</html>
